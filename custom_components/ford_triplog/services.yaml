import_charging_sites:
  fields:
    file:
      required: true
      example: import/charging_sites_ch.json
      selector:
        text:

download_charging_database:
  fields:
    country:
      required: true
      example: CH
      selector:
        text:

update_journeys:
  name: Update journeys
  description: Create missing journeys from existing trips and charging sessions.
  fields:
    entry_id:
      name: Config entry
      description: Optional when multiple Ford Triplog instances are active.
      required: false
      selector:
        text:
    start_date:
      name: Start date
      description: Optional first date of the period to process.
      required: false
      selector:
        date:
    end_date:
      name: End date
      description: Optional last date of the period to process.
      required: false
      selector:
        date:

rebuild_journeys:
  name: Rebuild journeys
  description: Delete and rebuild journeys from existing trips and charging sessions.
  fields:
    entry_id:
      name: Config entry
      description: Optional when multiple Ford Triplog instances are active.
      required: false
      selector:
        text:
    start_date:
      name: Start date
      description: Optional first date of the period to rebuild.
      required: false
      selector:
        date:
    end_date:
      name: End date
      description: Optional last date of the period to rebuild.
      required: false
      selector:
        date:

delete_journeys:
  name: Delete journeys
  description: Delete stored journeys without changing trips or charging sessions.
  fields:
    entry_id:
      name: Config entry
      description: Optional when multiple Ford Triplog instances are active.
      required: false
      selector:
        text:
    start_date:
      name: Start date
      description: Optional first date of the period to delete.
      required: false
      selector:
        date:
    end_date:
      name: End date
      description: Optional last date of the period to delete.
      required: false
      selector:
        date:

set_charge_cost:
  name: Set charging cost
  description: Add or replace manually verified costs for an archived charging session.
  fields:
    entry_id:
      name: Config entry
      description: Optional when multiple Ford Triplog instances are active.
      required: false
      selector:
        text:
    charge_id:
      name: Charge ID
      description: Identifier of the charging session to update.
      required: true
      example: "20260731T072339"
      selector:
        text:
    cost_total:
      name: Total cost
      description: Total amount paid for the charging session.
      required: true
      example: 21.45
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    currency:
      name: Currency
      description: Three-letter currency code.
      required: true
      example: CHF
      default: CHF
      selector:
        select:
          options:
            - CHF
            - EUR
            - GBP
            - USD

clear_charge_cost:
  name: Clear charging cost
  description: Remove all stored cost information from an archived charging session.
  fields:
    entry_id:
      name: Config entry
      description: Optional when multiple Ford Triplog instances are active.
      required: false
      selector:
        text:
    charge_id:
      name: Charge ID
      description: Identifier of the charging session whose costs should be removed.
      required: true
      example: "20260731T072339"
      selector:
        text:

edit_pause:
  name: Edit journey pause
  description: Add or replace manually maintained data for a pause in an archived journey.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    journey_id:
      name: Journey ID
      required: true
      selector:
        text:
    pause_id:
      name: Pause ID
      required: true
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    title:
      name: Title
      selector:
        text:
    note:
      name: Note
      selector:
        text:
          multiline: true
    location:
      name: Location
      selector:
        text:
    cost_total:
      name: Cost
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    currency:
      name: Currency
      selector:
        text:

clear_pause_edit:
  name: Clear journey pause edit
  description: Remove all manually maintained data from a pause.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    journey_id:
      name: Journey ID
      required: true
      selector:
        text:
    pause_id:
      name: Pause ID
      required: true
      selector:
        text:

rebuild_last_route:
  name: Rebuild last route
  description: Re-run OSRM map matching for the most recently stored route using the configured local OSRM service.
  fields:
    entry_id:
      name: Config entry
      description: Optional when multiple Ford Triplog instances are active.
      required: false
      selector:
        text:

simulate_dynamic_charging:
  name: Simulate dynamic charging (TEST Dynamic only)
  fields:
    action:
      required: true
      selector:
        select:
          options: [start, step, meter_adjust, price_change, stop, status, reset, publish]
    vehicle_id:
      required: false
      selector:
        number:
          min: 1
          max: 99999
          mode: box
    zone_id:
      required: false
      selector:
        text:
    energy_kwh:
      required: false
      selector:
        number:
          min: 0.001
          max: 100
          step: 0.001
          mode: box
    pricing_mode:
      required: false
      description: Optional at start. meter_boundaries tests the production interval pricing function; default steps keeps the previous simulator.
      selector:
        select:
          options: [steps, meter_boundaries]
    test_price_per_kwh:
      required: false
      description: Test-only price at start (meter_boundaries) or price_change; EUR/kWh or CHF/kWh per configured tariff. Does not change the HA price sensor.
      selector:
        number:
          min: 0
          max: 100
          step: any
          mode: box
