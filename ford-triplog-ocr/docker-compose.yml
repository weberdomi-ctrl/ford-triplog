services:
  ford-triplog-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ford-triplog-ocr
    restart: unless-stopped

    ports:
      - "${OCR_HOST_PORT:-9080}:8000"

    environment:
      OCR_API_KEY: "${OCR_API_KEY:-CHANGE_ME_LONG_RANDOM_KEY}"
      OCR_MAX_FILE_MB: "${OCR_MAX_FILE_MB:-20}"
      OCR_PDF_DPI: "${OCR_PDF_DPI:-200}"
      OCR_LOG_LEVEL: "${OCR_LOG_LEVEL:-INFO}"

    volumes:
      - ./data:/data

    mem_limit: 2g

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
