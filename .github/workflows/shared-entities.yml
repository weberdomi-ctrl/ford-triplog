name: Shared entity ownership regression tests

on:
  push:
    paths:
      - 'custom_components/ford_triplog/vehicle_context.py'
      - 'custom_components/ford_triplog/__init__.py'
      - 'custom_components/ford_triplog/sensor.py'
      - 'custom_components/ford_triplog/binary_sensor.py'
      - 'custom_components/ford_triplog/select.py'
      - 'test/test_shared_entities_owner_beta7_r6.py'
  pull_request:
    paths:
      - 'custom_components/ford_triplog/vehicle_context.py'
      - 'custom_components/ford_triplog/__init__.py'
      - 'custom_components/ford_triplog/sensor.py'
      - 'custom_components/ford_triplog/binary_sensor.py'
      - 'custom_components/ford_triplog/select.py'
      - 'test/test_shared_entities_owner_beta7_r6.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-entities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile custom_components/ford_triplog/__init__.py custom_components/ford_triplog/vehicle_context.py custom_components/ford_triplog/sensor.py custom_components/ford_triplog/binary_sensor.py custom_components/ford_triplog/select.py
      - name: Run shared ownership regression tests
        run: python -m unittest discover -s test -p 'test_shared_entities_owner_beta7_r6.py' -v
