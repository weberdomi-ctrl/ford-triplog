name: OSRM minimum trip distance tests
on:
  pull_request:
    paths:
      - 'custom_components/ford_triplog/config_flow.py'
      - 'custom_components/ford_triplog/coordinator.py'
      - 'custom_components/ford_triplog/route_tracker.py'
      - 'custom_components/ford_triplog/osrm_policy.py'
      - 'custom_components/ford_triplog/const.py'
      - 'test/test_osrm_min_distance_r22.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  osrm-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile custom_components/ford_triplog/const.py custom_components/ford_triplog/osrm_policy.py custom_components/ford_triplog/route_tracker.py custom_components/ford_triplog/coordinator.py custom_components/ford_triplog/config_flow.py
      - name: Run OSRM regression tests
        run: python -m unittest discover -s test -p 'test_osrm_min_distance_r22.py' -v
