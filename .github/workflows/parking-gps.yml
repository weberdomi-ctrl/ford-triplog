name: Parking GPS regression tests

on:
  pull_request:
    paths:
      - 'custom_components/ford_triplog/coordinator.py'
      - 'custom_components/ford_triplog/trip_start_position.py'
      - 'custom_components/ford_triplog/route_tracker.py'
      - 'custom_components/ford_triplog/fordpass_gps_timestamp.py'
      - 'test/test_trip_start_position_beta7_r1.py'
      - 'test/test_fordpass_gps_timestamp_beta7_r2.py'
      - 'test/test_post_off_oem_parking_beta7_r3.py'
      - 'test/test_trip_start_position_r21.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parking-gps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile custom_components/ford_triplog/coordinator.py custom_components/ford_triplog/trip_start_position.py custom_components/ford_triplog/route_tracker.py custom_components/ford_triplog/fordpass_gps_timestamp.py
      - name: Run parking GPS regression tests
        run: |
          python -m unittest discover -s test -p 'test_trip_start_position_r21.py' -v
          python -m unittest discover -s test -p 'test_trip_start_position_beta7_r1.py' -v
          python -m unittest discover -s test -p 'test_fordpass_gps_timestamp_beta7_r2.py' -v
          python -m unittest discover -s test -p 'test_post_off_oem_parking_beta7_r3.py' -v
