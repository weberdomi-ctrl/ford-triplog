name: Ford unplug charging-session regression

on:
  pull_request:
    paths:
      - 'custom_components/ford_triplog/coordinator.py'
      - 'custom_components/ford_triplog/charge.py'
      - 'custom_components/ford_triplog/charging_duration.py'
      - 'custom_components/ford_triplog/sensor.py'
      - 'custom_components/ford_triplog/history.py'
      - 'custom_components/ford_triplog/journey_manager.py'
      - 'test/test_plug_out_charge_end_beta7_r7.py'
      - 'test/test_charging_transfer_duration_beta7_r9.py'
  push:
    paths:
      - 'custom_components/ford_triplog/coordinator.py'
      - 'custom_components/ford_triplog/charge.py'
      - 'custom_components/ford_triplog/charging_duration.py'
      - 'custom_components/ford_triplog/sensor.py'
      - 'custom_components/ford_triplog/history.py'
      - 'custom_components/ford_triplog/journey_manager.py'
      - 'test/test_plug_out_charge_end_beta7_r7.py'
      - 'test/test_charging_transfer_duration_beta7_r9.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unplug-charge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile custom_components/ford_triplog/coordinator.py custom_components/ford_triplog/charge.py
      - name: Run November 10 unplug regression tests
        run: python -m unittest discover -s test -p 'test_plug_out_charge_end_beta7_r7.py' -v
      - name: Run overnight charging-duration regression tests
        run: python -m unittest discover -s test -p 'test_charging_transfer_duration_beta7_r9.py' -v
