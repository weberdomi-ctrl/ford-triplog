name: Ford charging completion display regression

on:
  pull_request:
    paths:
      - 'custom_components/ford_triplog/charging_time.py'
      - 'custom_components/ford_triplog/sensor.py'
      - 'custom_components/ford_triplog/history.py'
      - 'custom_components/ford_triplog/export.py'
      - 'test/test_charge_completion_display_beta7_r9.py'
      - '.github/workflows/charging-completion-display.yml'
  push:
    paths:
      - 'custom_components/ford_triplog/charging_time.py'
      - 'custom_components/ford_triplog/sensor.py'
      - 'custom_components/ford_triplog/history.py'
      - 'custom_components/ford_triplog/export.py'
      - 'test/test_charge_completion_display_beta7_r9.py'
      - '.github/workflows/charging-completion-display.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile custom_components/ford_triplog/charging_time.py custom_components/ford_triplog/sensor.py custom_components/ford_triplog/history.py custom_components/ford_triplog/export.py
      - name: Run completion vs unplug regression tests
        run: python -m unittest discover -s test -p 'test_charge_completion_display_beta7_r9.py' -v
      - name: Preserve R7 unplug matching regression
        run: python -m unittest discover -s test -p 'test_plug_out_charge_end_beta7_r7.py' -v
